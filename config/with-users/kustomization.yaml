resources:
  - ../base
  - users.yaml

patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: perilinkle
      namespace: openshell
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: USERS_CONFIGMAP
          value: perilinkle-users
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: USERS_SECRET
          value: perilinkle-user-passwords
