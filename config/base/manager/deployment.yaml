apiVersion: apps/v1
kind: Deployment
metadata:
  name: perilinkle
  namespace: openshell
  labels:
    app.kubernetes.io/name: perilinkle
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: perilinkle
  template:
    metadata:
      labels:
        app.kubernetes.io/name: perilinkle
    spec:
      serviceAccountName: perilinkle
      containers:
        - name: manager
          image: quay.io/gordons/perilinkle:latest
          imagePullPolicy: Always
          args:
            - --leader-elect
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: KEYCLOAK_URL
              value: http://keycloak.openshell.svc.cluster.local
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin
                  key: password
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
